<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kataliya</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div class="screen" id="loading-screen">
    <div class="logo">
      <div class="ring ring-3"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-1"></div>
      <div class="core"></div>
    </div>
    <h1 class="brand-name">Kataliya</h1>
    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- SIGN IN SCREEN -->
  <div class="screen hidden" id="signin-screen">
    <div class="logo small">
      <div class="ring ring-3"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-1"></div>
      <div class="core"></div>
    </div>
    <h1 class="brand-name">Kataliya</h1>
    <div class="auth-box">
      <input type="email" placeholder="Email address" class="auth-input"/>
      <input type="password" placeholder="Password" class="auth-input"/>
      <button class="auth-btn">Sign In</button>
      <p class="auth-link">No account? <a href="#">Sign up</a></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
